services:
  db:
    image: postgres:16-alpine
    container_name: pumachefcitos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pumachefcitos
      POSTGRES_USER: pumachefcitos
      POSTGRES_PASSWORD: pumachefcitos
    ports:
      - "5432:5432"
    volumes:
      - pumachefcitos_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  pumachefcitos_pgdata:
